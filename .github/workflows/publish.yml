# Publish to GHCR only after CI (tests, lint, image smoke) passes on main.
# Tags: :sha-<short commit> (immutable, for rollbacks) + :latest (rolling).
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/realbeepmcjeep/obsidian-mcp-lite

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build stamp
        id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.time }}
            BUILD_TAG=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pushed tag
        id: tag
        run: |
          img="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep -m1 ':sha-')"
          echo "sha_tag=${img##*:}" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the pushed image
        env:
          SMOKE_WRITER_TOKEN: ci-writer-token-0123456789abcdef0123456789
          SMOKE_READER_TOKEN: ci-reader-token-0123456789abcdef0123456789
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ steps.tag.outputs.sha_tag }}"
          docker pull "$img"
          root="$(mktemp -d)"
          mkdir -p "$root/vault/Private" "$root/vault/Projects" "$root/data"
          echo "secret" > "$root/vault/Private/secret.md"
          trap 'docker rm -f obsidian-pub >/dev/null 2>&1 || true' EXIT
          docker run -d --name obsidian-pub --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:18000:8000 -e SMOKE_WRITER_TOKEN -e SMOKE_READER_TOKEN \
            -v "$root/vault:/vault" -v "$PWD/deploy/ci-acl.yaml:/config/acl.yaml:ro" \
            -v "$root/data:/data" "$img"
          python3 scripts/smoke.py --url http://127.0.0.1:18000 || { docker logs obsidian-pub; exit 1; }

  # GHCR creates new packages as private even for public repos. If this job
  # fails, the package owner must set it public once (GitHub → Packages →
  # obsidian-mcp-lite → Package settings → Change visibility), then re-run.
  public-pull:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Anonymous pull check (:sha and :latest)
        run: |
          set -euo pipefail
          python3 scripts/verify_public_image.py "${{ needs.publish.outputs.sha_tag }}"
          python3 scripts/verify_public_image.py latest
