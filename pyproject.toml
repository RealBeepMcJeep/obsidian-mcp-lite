[project]
name = "obsidian-mcp-lite"
version = "0.1.0"
description = "Small MCP server exposing an Obsidian vault to several agents with per-agent folder permissions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=2.2,<3",
    "pyyaml>=6.0,<7",
    "regex>=2024.11",
    "uvicorn>=0.30",
]

[project.scripts]
obsidian-mcp-lite = "obsidian_mcp_lite.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp_lite"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
